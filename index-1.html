<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نادي البلايستيشن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --blau:#004D98; --blau-2:#1279C6; --grana:#A50044; --grana-2:#E01361;
    --gold:#FFC53D; --gold-2:#E8A100; --bg:#0A0D18; --surface:#12162A;
    --surface-2:#191F3C; --surface-3:#232B54; --line:#2B3260;
    --text:#F5F3EC; --text-dim:#98A0C2; --ok:#2FDB8A; --danger:#FF6673;
    --r-lg:20px; --r-md:16px; --r-sm:11px;
    --shadow-soft:0 10px 30px rgba(0,0,0,.28); --shadow-lift:0 16px 40px rgba(0,0,0,.4);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F2EFE4; --surface:#FFFFFF; --surface-2:#F6F2E4; --surface-3:#ECE6D2;
      --line:#DDD5BC; --text:#1B1C24; --text-dim:#63677E;
      --shadow-soft:0 10px 30px rgba(30,20,0,.08); --shadow-lift:0 16px 40px rgba(30,20,0,.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0D18; --surface:#12162A; --surface-2:#191F3C; --surface-3:#232B54;
    --line:#2B3260; --text:#F5F3EC; --text-dim:#98A0C2;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; max-width:100%; overflow-x:hidden;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Cairo',system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(1200px 560px at 88% -12%, rgba(0,77,152,.32), transparent 60%),
      radial-gradient(950px 540px at 2% 112%, rgba(165,0,68,.26), transparent 60%);}
  #app{position:relative; z-index:1; min-height:100%;}
  .num{font-family:'Oswald',sans-serif; letter-spacing:.02em;}
  a,button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:99px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important;} }

  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 18px;}
  .login-card{width:100%; max-width:400px; background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--line); border-radius:var(--r-lg); padding:34px 28px 28px; text-align:center;
    box-shadow:var(--shadow-lift); animation:riseIn .5s cubic-bezier(.2,.8,.2,1);}
  @keyframes riseIn{from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:none;}}
  .brand-title{font-weight:900;font-size:29px;margin:6px 0 0;}
  .brand-sub{color:var(--text-dim);font-size:13px;letter-spacing:.06em;margin-bottom:24px;}
  .field{text-align:right;margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%; padding:12px 14px; border-radius:var(--r-sm);
    border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:15px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blau-2); box-shadow:0 0 0 3px rgba(18,121,198,.18);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none;
    border-radius:var(--r-sm); padding:12px 18px; font-weight:700; font-size:14px;
    transition:transform .12s cubic-bezier(.2,.8,.2,1), filter .15s ease, box-shadow .15s ease, opacity .15s ease;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(90deg,var(--blau),var(--blau-2)); color:#fff; width:100%; box-shadow:0 8px 20px rgba(18,121,198,.32);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-grana{background:linear-gradient(90deg,var(--grana),var(--grana-2)); color:#fff; box-shadow:0 8px 20px rgba(224,19,97,.28);}
  .btn-grana:hover{filter:brightness(1.08);}
  .btn-ghost{background:var(--surface-2); border:1px solid var(--line); color:var(--text);}
  .btn-ghost:hover{background:var(--surface-3);}
  .btn-gold{background:linear-gradient(90deg,var(--gold),var(--gold-2)); color:#241800; box-shadow:0 8px 18px rgba(255,197,61,.25);}
  .btn-sm{padding:9px 13px; font-size:13px; border-radius:10px;}
  .btn-danger{background:rgba(255,102,115,.14); color:var(--danger); border:1px solid rgba(255,102,115,.35);}
  .btn-danger:hover{background:rgba(255,102,115,.22);}
  .btn:disabled{opacity:.4; cursor:not-allowed; box-shadow:none;}
  .login-error{color:var(--danger); font-size:13px; margin:-6px 0 14px;}
  .login-hint{margin-top:16px; font-size:11px; color:var(--text-dim);}

  .shell{display:flex; min-height:100vh; width:100%; max-width:100vw; overflow-x:hidden;}
  .sidebar{width:226px; flex:0 0 226px; background:var(--surface); border-left:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 14px; position:sticky; top:0; align-self:flex-start; height:100vh;
    transition:transform .25s cubic-bezier(.2,.8,.2,1);}
  .side-logo{display:flex; align-items:center; gap:10px; padding:4px 6px 20px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .side-logo svg{width:40px;height:40px;flex:none;}
  .side-logo .t1{font-weight:900; font-size:16px;}
  .side-logo .t2{font-size:10px; color:var(--text-dim);}
  .nav-item{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px;
    color:var(--text-dim); font-weight:700; font-size:14px; margin-bottom:4px; border:1px solid transparent;
    transition:background .15s ease, color .15s ease, border-color .15s ease;}
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item .ic{width:18px;text-align:center;}
  .nav-item.active{background:var(--surface-2); color:var(--text); border-color:var(--line);}
  .nav-item.active::after{content:"";width:6px;height:6px;border-radius:99px;background:var(--gold);margin-right:auto;}
  .side-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);}
  .who{font-size:12px; color:var(--text-dim); margin-bottom:8px;}
  .who b{color:var(--text);}
  .main{flex:1; min-width:0; max-width:100%; overflow-x:hidden; padding:26px 28px 60px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; flex-wrap:wrap;}
  .page-title{font-weight:900; font-size:22px; margin:0;}
  .page-sub{color:var(--text-dim); font-size:13px; margin-top:3px;}
  .mobile-topbar{display:none;}
  @media (max-width:860px){
    .sidebar{position:fixed; z-index:40; top:0; right:0; bottom:0; left:auto; height:100%; width:78%;
      max-width:280px; min-width:0; transform:translateX(100%); flex-basis:auto;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:16px 14px 60px;}
    .mobile-topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
      padding-top:env(safe-area-inset-top,0px);}
    .burger{background:var(--surface-2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:9px 12px;}
    .scrim{display:none;}
    .scrim.show{display:block; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:35; animation:fadeIn .18s ease;}
  }
  @media (min-width:861px) and (max-width:1100px){
    .sidebar{width:196px; flex-basis:196px;}
    .main{padding:22px 20px 60px;}
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  .grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:17px; position:relative; overflow:hidden; box-shadow:var(--shadow-soft); min-width:0;}
  .device-card{cursor:pointer; transition:transform .16s cubic-bezier(.2,.8,.2,1), border-color .16s ease, box-shadow .16s ease;}
  .device-card:hover{transform:translateY(-3px); border-color:var(--blau-2); box-shadow:var(--shadow-lift);}
  .device-card.active{border-color:var(--grana-2); background:linear-gradient(160deg, rgba(165,0,68,.22), var(--surface) 62%);}
  .dev-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .dev-name{font-weight:800; font-size:16px;}
  .dev-type{font-size:11px; color:var(--text-dim); background:var(--surface-3); padding:4px 10px; border-radius:99px;}
  .status-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-left:6px;}
  .status-dot.idle{background:var(--ok);}
  .status-dot.active{background:var(--grana-2); box-shadow:0 0 0 4px rgba(165,0,68,.25); animation:pulse 1.5s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(165,0,68,.4);}70%{box-shadow:0 0 0 9px rgba(165,0,68,0);}100%{box-shadow:0 0 0 0 rgba(165,0,68,0);}}
  .dev-status-label{font-size:12px; color:var(--text-dim); margin-bottom:12px;}
  .dev-timer{font-family:'Oswald',sans-serif; font-size:27px; font-weight:600; margin-bottom:4px;}
  .dev-cost{font-size:13px; color:var(--gold); font-weight:700; margin-bottom:12px;}
  .dev-rates{font-size:11.5px; color:var(--text-dim); margin-bottom:12px; line-height:1.9; overflow-wrap:anywhere;}
  .dev-rates span{color:var(--text); font-weight:700;}
  .dev-mode-tag{font-size:11px; color:var(--text-dim); margin-bottom:10px;}
  .dev-mode-tag b{color:var(--gold);}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
  .section-head h3{margin:0; font-size:15px; font-weight:800;}
  .list-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; box-shadow:var(--shadow-soft);}
  .row-item{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); transition:background .15s ease;}
  .row-item:hover{background:var(--surface-2);}
  .row-item:last-child{border-bottom:none;}
  .row-avatar{width:40px;height:40px;border-radius:12px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;overflow:hidden;}
  .row-avatar img{width:100%;height:100%;object-fit:cover;}
  .row-main{flex:1; min-width:0; overflow-wrap:anywhere;}
  .row-title{font-weight:700; font-size:14px;}
  .row-sub{font-size:12px; color:var(--text-dim);}
  .row-actions{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .rate-input{width:62px; padding:7px 8px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text); font-size:13px; text-align:center;}
  .stock-badge{font-size:11px; padding:4px 9px; border-radius:99px; background:var(--surface-3); color:var(--text-dim);}
  .stock-badge.low{color:var(--danger); background:rgba(255,102,115,.14);}
  .empty-state{padding:38px 16px; text-align:center; color:var(--text-dim); font-size:13px;}
  .form-card{background:var(--surface); border:1px dashed var(--line); border-radius:var(--r-md); padding:17px; margin-top:14px; min-width:0;}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:11px; margin-bottom:12px;}
  .form-grid .field{margin-bottom:0;}

  .mode-choice{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0 16px;}
  .mode-chip{border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:11px 8px; text-align:center; transition:all .15s ease;}
  .mode-chip .lbl{font-size:12.5px; font-weight:700; display:block;}
  .mode-chip .pr{font-size:11px; color:var(--text-dim); display:block; margin-top:3px;}
  .mode-chip.sel{border-color:var(--gold); background:rgba(255,197,61,.12); box-shadow:0 0 0 1px var(--gold) inset;}

  .modal-scrim{position:fixed; inset:0; background:rgba(4,6,14,.66); backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px); z-index:60; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .18s ease;}
  @media (min-width:700px){.modal-scrim{align-items:center;}}
  .modal{width:100%; max-width:580px; max-height:92vh; overflow-y:auto; background:var(--surface);
    border:1px solid var(--line); border-radius:22px 22px 0 0; padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));
    box-shadow:var(--shadow-lift); animation:sheetUp .28s cubic-bezier(.2,.8,.2,1);}
  @keyframes sheetUp{from{opacity:0; transform:translateY(26px);}to{opacity:1; transform:none;}}
  @media (min-width:700px){.modal{border-radius:20px; animation:popIn .22s cubic-bezier(.2,.8,.2,1);}}
  @keyframes popIn{from{opacity:0; transform:translateY(10px) scale(.97);}to{opacity:1; transform:none;}}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px;}
  .modal-title{font-weight:900; font-size:18px; margin:0;}
  .modal-title small{display:block; font-weight:600; font-size:12px; color:var(--text-dim); margin-top:3px;}
  .modal-close{background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    width:33px;height:33px;border-radius:99px;font-size:16px;line-height:1;}
  .kv-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0;
    border-bottom:1px solid var(--line); font-size:13px; gap:10px;}
  .kv-row .k{flex:0 0 auto; color:var(--text-dim);}
  .kv-row .v{min-width:0; overflow-wrap:anywhere; text-align:left; font-weight:700;}
  .kv-row:last-child{border-bottom:none;}
  .drink-line{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .drink-line:last-child{border-bottom:none;}
  .drink-pick{display:flex; align-items:center; gap:10px; padding:11px; border:1px solid var(--line);
    border-radius:12px; margin-bottom:8px; transition:border-color .15s ease;}
  .drink-pick:hover{border-color:var(--blau-2);}
  .drink-pick img{width:38px;height:38px;border-radius:99px;object-fit:cover;background:var(--surface-3);}
  .qty-ctl{display:flex; align-items:center; gap:8px;}
  .qty-ctl button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-weight:800;}
  .qty-ctl button:hover{background:var(--surface-3);}
  .total-strip{display:flex; justify-content:space-between; align-items:center; background:var(--surface-2);
    border-radius:12px; padding:13px 15px; margin:14px 0; font-weight:800;}
  .total-strip .amt{color:var(--gold); font-family:'Oswald',sans-serif; font-size:19px;}

  .shift-hero{background:linear-gradient(150deg, rgba(0,77,152,.28), var(--surface) 55%);
    border:1px solid var(--line); border-radius:var(--r-lg); padding:24px; margin-bottom:20px; box-shadow:var(--shadow-soft);}
  .shift-hero.closed{background:var(--surface);}
  .shift-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-top:16px;}
  .stat-box{background:var(--surface-2); border:1px solid var(--line); border-radius:13px; padding:13px; min-width:0;}
  .stat-box .lbl{font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  .stat-box .val{font-family:'Oswald',sans-serif; font-size:19px; font-weight:600;}
  .stat-box.pos .val{color:var(--ok);}
  .stat-box.neg .val{color:var(--danger);}
  .stat-box.net .val{color:var(--gold); font-size:21px;}
  .exp-line{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .exp-line:last-child{border-bottom:none;}

  .receipt{background:#fff; color:#111; border-radius:14px; padding:20px; font-size:13px;}
  .receipt-head{text-align:center; margin-bottom:14px;}
  .receipt-head svg{width:64px;height:64px;margin:0 auto 6px; filter:none; display:block;}
  .receipt-head h2{margin:0; font-size:18px;}
  .receipt-head p{margin:2px 0 0; font-size:11px; color:#555;}
  .receipt hr{border:none; border-top:1px dashed #bbb; margin:12px 0;}
  .receipt table{width:100%; border-collapse:collapse; font-size:12px;}
  .receipt th, .receipt td{text-align:right; padding:5px 0;}
  .receipt .r-row{display:flex; justify-content:space-between; font-size:12px; padding:2px 0;}

  .table-wrap{overflow-x:auto;}
  table.plain{width:100%; border-collapse:collapse; font-size:13px; min-width:560px;}
  table.plain th{text-align:right; color:var(--text-dim); font-weight:700; font-size:11px; padding:9px 10px; border-bottom:1px solid var(--line);}
  table.plain td{padding:11px 10px; border-bottom:1px solid var(--line);}
  table.plain tr:last-child td{border-bottom:none;}
  .link-row{cursor:pointer; transition:background .15s ease;}
  .link-row:hover{background:var(--surface-2);}
  .badge-role{font-size:10px; padding:2px 8px; border-radius:99px; background:var(--surface-3); color:var(--text-dim);}
  .badge-role.admin{background:rgba(255,197,61,.16); color:var(--gold);}
  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:10px; margin-bottom:16px;}
  .theme-swatch{display:flex; gap:3px; padding:8px; border-radius:12px; border:2px solid var(--line); cursor:pointer; height:36px; align-items:center; justify-content:center;}
  .theme-swatch.sel{box-shadow:0 0 0 2px var(--gold); border-color:var(--gold);}
  .theme-swatch span{display:block; width:9px; height:22px; border-radius:4px;}
  .badge-status{font-size:10px; padding:2px 9px; border-radius:99px;}
  .badge-status.open{background:rgba(47,219,138,.16); color:var(--ok);}
  .tabs2{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .tab2{padding:8px 14px; border-radius:10px; font-size:13px; font-weight:700; color:var(--text-dim);
    background:var(--surface); border:1px solid var(--line); cursor:pointer;}
  .tab2.active{background:var(--surface-2); color:var(--text); border-color:var(--gold);}

  .price-grid{display:grid; grid-template-columns:auto 1fr 1fr 1fr; gap:6px 8px; align-items:center; font-size:12px;}
  .price-grid .h{font-size:10.5px; color:var(--text-dim); text-align:center; font-weight:700;}
  .price-grid .lbl{font-size:11.5px; color:var(--text-dim); white-space:nowrap;}
  .busy-overlay{position:fixed; inset:0; z-index:100; background:rgba(4,6,14,.45); display:flex; align-items:center; justify-content:center;}
  .busy-box{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 26px; font-weight:800; box-shadow:var(--shadow-lift);}
  .app-footer{text-align:center; padding:30px 10px 8px; color:var(--text-dim); font-size:11px; letter-spacing:.05em;}
  .app-footer b{color:var(--gold); font-weight:800;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   برشلونة — نادي البلايستيشن (إصدار 5)
   - حساب الأدمن admin/admin123 مخفي ومحمي من الحذف
   - الأدمن يعدل يوزر/باسورد أي موظف والتعديل بيتطبق على كل الفروع
   - زرار "تغيير باسوردي" في القائمة الجانبية
   - الموظف لا يستطيع إلغاء أي جلسة إطلاقًا (أدمن فقط)
   - حذف/تصحيح البيع المباشر مع إرجاع المخزون (أدمن)
   - فلترة السجل بالتاريخ + تصدير CSV
   - خصم يدوي عند إغلاق الجلسة (أدمن)
   - تنبيه مخزون منخفض
   ============================================================ */

let db = null;

/* ============================================================
   طبقة الاتصال بـ Supabase (بدل window.claude.use('db'))
   ------------------------------------------------------------
   حطّ بيانات مشروعك من Supabase Dashboard > Project Settings > API
   لازم كمان تشغّل SQL setup اللي في آخر الملف (تعليق SUPABASE SETUP)
   جوه SQL editor بتاع مشروعك قبل ما تشغّل التطبيق.
   ============================================================ */
const SUPABASE_URL = 'https://lxgqgwyomdatntemftyv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_iviICZ8Ql4J3K-FT76L8yA_AtHwyFyf';

/* ---- شيم بيحاكي شكل Firestore (collection/doc/where/onSnapshot...)

   وكل استخدامات .get/.set/.update/.delete/.where/.onSnapshot) تفضل
   شغالة زي ما هي من غير ما نلمسها. ---- */
function withTimeout(promise, ms){
  ms = ms || 15000;
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('انتهت مهلة الاتصال بقاعدة البيانات — تأكد إن مشروع Supabase شغال (مش Paused) وإن النت متصل')), ms)),
  ]);
}
function makeSupabaseFirestoreShim(client){
  const TABLE = 'documents';
  function docSnap(row, id){
    return { id, exists: !!row, data: () => row ? {...row.data} : undefined };
  }
  function applyLocalFilters(rows, filters, orderSpec, limitN){
    let out = rows;
    filters.forEach(f=>{
      out = out.filter(r=>{
        const v = r.data ? r.data[f.field] : undefined;
        if(f.op === '==') return v === f.value;
        if(f.op === '<')  return v !== undefined && v < f.value;
        if(f.op === '<=') return v !== undefined && v <= f.value;
        if(f.op === '>')  return v !== undefined && v > f.value;
        if(f.op === '>=') return v !== undefined && v >= f.value;
        return true;
      });
    });
    if(orderSpec){
      const {field, dir} = orderSpec;
      out = [...out].sort((a,b)=>{
        const av = a.data?.[field], bv = b.data?.[field];
        if(av === bv) return 0;
        const cmp = av > bv ? 1 : -1;
        return dir === 'desc' ? -cmp : cmp;
      });
    }
    if(limitN != null) out = out.slice(0, limitN);
    return out;
  }
  function makeCollectionRef(path, filters, orderSpec, limitN){
    filters = filters || []; orderSpec = orderSpec || null; limitN = (limitN == null ? null : limitN);
    const genId = ()=> self.crypto?.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2);
    const ref = {
      doc(id){ return makeDocRef(path + '/' + (id || genId())); },
      where(field, op, value){ return makeCollectionRef(path, [...filters, {field, op, value}], orderSpec, limitN); },
      orderBy(field, dir){ return makeCollectionRef(path, filters, {field, dir: dir||'asc'}, limitN); },
      limit(n){ return makeCollectionRef(path, filters, orderSpec, n); },
      async add(data){
        const id = genId();
        const { error } = await withTimeout(client.from(TABLE).insert({ collection_path: path, id, data }));
        if(error) throw error;
        return makeDocRef(path + '/' + id);
      },
      async get(){
        const { data: rows, error } = await withTimeout(client.from(TABLE).select('id,data').eq('collection_path', path));
        if(error) throw error;
        const mapped = rows.map(r=>({ id:r.id, data:r.data }));
        const finalRows = applyLocalFilters(mapped, filters, orderSpec, limitN);
        return { docs: finalRows.map(r=>docSnap(r.data, r.id)), empty: finalRows.length===0 };
      },
      onSnapshot(onNext, onError){
        let stopped = false;
        const refetch = async ()=>{
          try{ const snap = await ref.get(); if(!stopped) onNext(snap); }
          catch(e){ if(!stopped && onError) onError(e); }
        };
        refetch();
        const channel = client.channel('col:'+path+':'+Math.random())
          .on('postgres_changes', { event:'*', schema:'public', table:TABLE, filter:`collection_path=eq.${path}` }, refetch)
          .subscribe();
        return ()=>{ stopped = true; client.removeChannel(channel); };
      },
    };
    return ref;
  }
  function makeDocRef(fullPath){
    const idx = fullPath.lastIndexOf('/');
    const path = fullPath.slice(0, idx);
    const id = fullPath.slice(idx+1);
    return {
      id, path: fullPath,
      async get(){
        const { data: row, error } = await withTimeout(client.from(TABLE).select('data').eq('collection_path', path).eq('id', id).maybeSingle());
        if(error) throw error;
        return docSnap(row ? row.data : null, id);
      },
      async set(data){
        const { error } = await withTimeout(client.from(TABLE).upsert({ collection_path: path, id, data }));
        if(error) throw error;
      },
      async update(partial){
        const { data: row, error: e1 } = await withTimeout(client.from(TABLE).select('data').eq('collection_path', path).eq('id', id).maybeSingle());
        if(e1) throw e1;
        const merged = { ...(row ? row.data : {}), ...partial };
        const { error } = await withTimeout(client.from(TABLE).upsert({ collection_path: path, id, data: merged }));
        if(error) throw error;
      },
      async delete(){
        const { error } = await withTimeout(client.from(TABLE).delete().eq('collection_path', path).eq('id', id));
        if(error) throw error;
      },
      onSnapshot(onNext, onError){
        let stopped = false;
        const refetch = async ()=>{
          try{ const snap = await this.get(); if(!stopped) onNext(snap); }
          catch(e){ if(!stopped && onError) onError(e); }
        };
        refetch();
        const channel = client.channel('doc:'+fullPath+':'+Math.random())
          .on('postgres_changes', { event:'*', schema:'public', table:TABLE, filter:`collection_path=eq.${path}` }, (payload)=>{
            if(payload.new?.id === id || payload.old?.id === id) refetch();
          }).subscribe();
        return ()=>{ stopped = true; client.removeChannel(channel); };
      },
    };
  }
  return {
    collection: (path)=> makeCollectionRef(path),
    doc: (path)=> makeDocRef(path),
    // ملاحظة: مفيش runTransaction هنا عمدًا — الكود عنده fallback جاهز
    // في دالة runTx() بيعمل get/set/update/delete بالتتابع من غير Firestore.
  };
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ n = Number(n)||0; return n.toLocaleString('ar-EG', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function fmtDuration(mins){

  const h=Math.floor(mins/60), m=Math.floor(mins%60), s=Math.floor((mins*60)%60);
  const p=x=>String(x).padStart(2,'0');
  return h>0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}

/* ---------- CSV export ---------- */
function csvEscape(v){ return '"'+String(v ?? '').replace(/"/g,'""')+'"'; }
function exportCsv(filename, headers, rows){
  const lines = [headers, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(['﻿'+lines], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');

/* ---------- Crypto ---------- */
function randomSalt(){
  const arr = new Uint8Array(16);
  (window.crypto || window.msCrypto).getRandomValues(arr);
  return [...arr].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function sha256Hex(text){
  const data = new TextEncoder().encode(text);
  const buf = await (window.crypto || window.msCrypto).subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* التشفير القديم (نسخة واحدة SHA-256) — باقي هنا بس عشان نتحقق من الحسابات القديمة ونرقّيها تلقائيًا */
async function legacyHashPassword(password, salt){ return sha256Hex(salt + '::' + password); }
function hexToBytes(hex){
  const arr = new Uint8Array(Math.floor((hex||'').length/2));
  for(let i=0;i<arr.length;i++) arr[i] = parseInt(hex.substr(i*2,2),16) || 0;
  return arr;
}
const PBKDF2_ITERATIONS = 100000;
/* تشفير أقوى: PBKDF2 بـ100,000 تكرار بدل SHA-256 لمرة واحدة، عشان يبقى أبطأ بكتير على أي محاولة تخمين */
async function hashPassword(password, salt){
  const subtle = (window.crypto || window.msCrypto).subtle;
  const keyMaterial = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await subtle.deriveBits(
    { name:'PBKDF2', salt: hexToBytes(salt), iterations: PBKDF2_ITERATIONS, hash:'SHA-256' },
    keyMaterial, 256
  );
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ---------- Transactions ---------- */
async function runTx(fn){
  if(db && typeof db.runTransaction === 'function'){
    return db.runTransaction(fn);
  }
  // شيم بديل لـ Firestore transactions: بنجمّع كل set/update/delete
  // (زي ما بتتكتب فعلاً في كل أماكن استخدامها في الكود، من غير await)
  // وبعدين ننفذهم فعليًا ونستنى كل واحد قبل ما نرجّع النتيجة —
  // بدل ما نسيبهم "fire and forget" ومحدش يستناهم يخلصوا.
  const ops = [];
  const tx = {
    get: ref => ref.get(),
    set: (ref, data) => { ops.push(()=>ref.set(data)); },
    update: (ref, data) => { ops.push(()=>ref.update(data)); },
    delete: ref => { ops.push(()=>ref.delete()); },
  };
  const result = await fn(tx);
  for(const op of ops){ await op(); }
  return result;
}

/* ---------- Pricing ---------- */
function defaultHourFromRates(device, kind, mode){ return (device?.rates?.[kind]?.[mode]) || 0; }
function getPrices(device, kind, mode){
  const p = device?.prices?.[kind]?.[mode];
  if(p && (p.q != null || p.h != null || p.hr != null)){
    return { q: Number(p.q)||0, h: Number(p.h)||0, hr: Number(p.hr)||0 };
  }
  const hr = defaultHourFromRates(device, kind, mode);
  return { q: hr>0?roundMoney(hr/4):0, h: hr>0?roundMoney(hr/2):0, hr: hr||0 };
}
function getRate(device, kind, mode){ return getPrices(device, kind, mode).hr; }
function minutesForAmount(prices, amount){
  const q = Number(prices.q)||0, h = Number(prices.h)||0, hr = Number(prices.hr)||0;
  amount = Math.max(0, Number(amount)||0);
  if(amount <= 0 || hr <= 0) return 0;
  if(q > 0 && amount < q) return 0; // أقل من سعر الربع = مرفوض
  if(amount >= hr) return Math.round(amount/hr*60);
  const pts = [[0,0]];
  if(q > 0 && q < hr) pts.push([q, 15]);
  if(h > 0 && h < hr && h > q) pts.push([h, 30]);
  pts.push([hr, 60]);
  for(let i=1;i<pts.length;i++){
    const [a0,m0]=pts[i-1], [a1,m1]=pts[i];
    if(amount <= a1) return Math.round(m0 + (amount-a0)/(a1-a0)*(m1-m0));
  }
  return 60;
}
function amountForMinutes(prices, minutes){
  const q = Number(prices.q)||0, h = Number(prices.h)||0, hr = Number(prices.hr)||0;
  minutes = Math.max(0, Number(minutes)||0);
  if(minutes <= 0 || hr <= 0) return 0;
  if(minutes >= 60) return roundMoney(hr*minutes/60);
  const pts = [[0,0]];
  if(q > 0 && q < hr) pts.push([15,q]);
  if(h > 0 && h < hr && h > q) pts.push([30,h]);
  pts.push([60,hr]);
  for(let i=1;i<pts.length;i++){
    const [m0,a0]=pts[i-1], [m1,a1]=pts[i];
    if(minutes <= m1) return roundMoney(a0 + (minutes-m0)/(m1-m0)*(a1-a0));
  }
  return hr;
}
function resolvePrices(customer, device, kind, mode){
  if(customer && customer.useCustomRate && customer.hourlyRate){
    const hr = Number(customer.hourlyRate)||0;
    const base = getPrices(device, kind, mode);
    const ratio = base.hr > 0 ? hr/base.hr : 1;
    return { q: roundMoney(base.q*ratio), h: roundMoney(base.h*ratio), hr };
  }
  return getPrices(device, kind, mode);
}
function resolveRate(customer, device, kind, mode){ return resolvePrices(customer, device, kind, mode).hr; }

function getSegments(session){
  if(session.segments && session.segments.length) return session.segments;
  return [{ kind:sessionKind(session), mode:session.mode, rate:session.rate, prices:session.prices, startTime:session.startTime, endTime:session.endTime||null, minutes:null, cost:null }];
}
function computeSessionTimeCost(session, atIso){
  if(session.billingType === 'time'){
    const prepaid = Number(session.prepaidAmount)||0;
    const planned = Number(session.plannedMinutes)||0;
    const totalMins = minutesBetween(session.startTime, atIso);
    if(totalMins > planned && planned > 0){
      const segs = getSegments(session);
      const curSeg = segs[segs.length-1];
      const curRate = curSeg?.rate || session.rate || 0;
      const overtimeMins = totalMins - planned;
      return roundMoney(prepaid + curRate*overtimeMins/60);
    }
    return prepaid;
  }
  const segs = getSegments(session);
  let total = 0;
  segs.forEach((seg,i)=>{
    const isLast = i === segs.length-1;
    if(seg.endTime) total += (seg.cost!=null ? Number(seg.cost) : roundMoney(seg.rate*minutesBetween(seg.startTime, seg.endTime)/60));
    else if(isLast) total += roundMoney(seg.rate*minutesBetween(seg.startTime, atIso)/60);
  });
  return roundMoney(total);
}

        const saleRef = dbDoc('drinkSales/'+p.id);

        if(!sSnap.exists) return;
        const sale = sSnap.data();

        tx.delete(saleRef);
      });

  finally{ setBusy(false); render(); }
}

async function boot(){
  document.documentElement.setAttribute('lang', state.lang);
  document.documentElement.setAttribute('dir', I18N[state.lang].dir);
  applyTheme(state.branding.theme, {skipSave:true});
  if(!window.isSecureContext || !(window.crypto && window.crypto.subtle)){
    bootError = 'الصفحة اتفتحت بطريقة المتصفح بيعتبرها غير آمنة (زي فتح الملف مباشرة من قائمة التنزيلات)، فميزة التشفير المطلوبة لتسجيل الدخول مش متاحة هنا. ارفع الملف مكان زي Netlify (يديك رابط https) وافتحه من الرابط ده بدل ما تفتحه من ملف التنزيلات مباشرة.';
    render(); return;
  }
  try{
    if(!window.supabase || !window.supabase.createClient) throw new Error('supabase-js لم يتم تحميلها');
    if(SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')){
      throw new Error('لازم تحط SUPABASE_URL و SUPABASE_ANON_KEY الحقيقيين بتوعك في أول السكريبت');
    }
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    db = makeSupabaseFirestoreShim(client);
  }catch(e){ console.error(e); db = null; }
  if(!db){ bootError = 'تعذر الاتصال بقاعدة البيانات في هذا العرض.'; render(); return; }
  await seedBranchesIfEmpty();
  db.collection('branches').onSnapshot(snap=>{
    state.branches = snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.branchesLoaded = true; scheduleRender();
  }, ()=>{ state.branchesLoaded = true; scheduleRender(); });
  if(state.shopId){ await enterShop(state.shopId); }
  setInterval(updateLiveTimers, 1000);
}

function subscribe(name){
  const u = dbCol(name).onSnapshot(snap=>{
    state[name] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    scheduleRender();
  }, ()=>{ scheduleRender(); });
  shopUnsubs.push(u);

function subscribeSessions(){
  sessionsUnsubs.forEach(fn=>{ try{ fn(); }catch(e){} });
  sessionsUnsubs = [];

  const u1 = dbCol('sessions').where('status','==','active').onSnapshot(snap=>{
    const active = snap.docs.map(d=>({id:d.id, ...d.data()}));
    const closed = state.sessions.filter(s => s.status === 'closed');
    mergeSessions(active, closed);
    scheduleRender();
  }, (err)=>{ console.error('active sessions sub', err); scheduleRender(); });
  sessionsUnsubs.push(u1);

  const u2 = dbCol('sessions')
    .where('status','==','closed')
    .orderBy('startTime','desc')
    .limit(CLOSED_SESSIONS_LIMIT)
    .onSnapshot(snap=>{
      const closed = snap.docs.map(d=>({id:d.id, ...d.data()}));
      const active = state.sessions.filter(s => s.status === 'active');
      state.hasMoreClosedSessions = closed.length >= CLOSED_SESSIONS_LIMIT;
      mergeSessions(active, closed);
      scheduleRender();
    }, (err)=>{ console.error('closed sessions sub', err); scheduleRender(); });
  sessionsUnsubs.push(u2);
}
function mergeSessions(active, closed){
  const map = new Map();
  active.forEach(s => map.set(s.id, s));
  closed.forEach(s => { if(!map.has(s.id)) map.set(s.id, s); });
  state.sessions = Array.from(map.values());
}
async function loadOlderSessions(){
  if(state.loadingOlderSessions) return;
  const closed = state.sessions.filter(s => s.status === 'closed');
  if(!closed.length){ showNotice('لا توجد جلسات مغلقة'); return; }
  const oldest = closed.reduce((min, s) => (s.startTime < min ? s.startTime : min), closed[0].startTime);
  state.loadingOlderSessions = true;
  setBusy(true); render();
  try{
    const snap = await dbCol('sessions')
      .where('status','==','closed')
      .where('startTime','<', oldest)
      .orderBy('startTime','desc')
      .limit(OLDER_SESSIONS_CHUNK)
      .get();
    const older = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(!older.length){
      state.hasMoreClosedSessions = false;
      showNotice('لا توجد جلسات أقدم');
    } else {
      const active = state.sessions.filter(s => s.status === 'active');
      const allClosed = [...closed, ...older];
      mergeSessions(active, allClosed);
      state.hasMoreClosedSessions = older.length >= OLDER_SESSIONS_CHUNK;
      showNotice(`تم تحميل ${older.length} جلسة إضافية`);
    }
  }catch(e){
    console.error(e);
    showNotice('تعذر تحميل الجلسات القديمة — تأكد من إنشاء الـ Index المطلوب');
  } finally {
    state.loadingOlderSessions = false;
    setBusy(false); render();
  }
}

/* ---------- Auth ---------- */
async function restoreSession(){
  const raw = localStorage.getItem(LS_KEY);
  if(!raw || !state.shopId){ state.currentUser = null; return; }
  let saved; try{ saved = JSON.parse(raw); }catch(e){ saved = null; }
  const username = saved && saved.username;
  const token = saved && saved.token;
  if(!username || !token){ localStorage.removeItem(LS_KEY); state.currentUser = null; return; }
  try{
    const snap = await db.collection('shops/'+state.shopId+'/users').where('username','==',username).limit(1).get();
    if(snap.empty){ localStorage.removeItem(LS_KEY); state.currentUser = null; return; }
    const doc = snap.docs[0];
    const u = doc.data();
    // لازم التوكن يتطابق مع اللي اتسجل وقت الدخول — كده محدش يقدر يدخل بحساب حد تاني
    // لمجرد إنه عرف اليوزرنيم بتاعه وحط الاسم في localStorage
    if(!u.sessionToken || u.sessionToken !== token){ localStorage.removeItem(LS_KEY); state.currentUser = null; return; }
    state.currentUser = { id:doc.id, username:u.username, name:u.name||u.username, role:u.role||'staff' };
    subscribeUsersIfAdmin();
  }catch(e){
    console.error(e);
    state.currentUser = null;
  }
}
async function doLogin(username, password){
  username = (username||'').trim();
  if(!username || !password){ state.loginError = 'أدخل البيانات كاملة'; render(); return; }
  setBusy(true);
  try{
    const snap = await db.collection('shops/'+state.shopId+'/users').where('username','==',username).limit(1).get();
    if(snap.empty){ state.loginError = 'بيانات الدخول غير صحيحة'; return; }
    const doc = snap.docs[0];
    const u = doc.data();
    let valid = false;
    const credSnap = await dbDoc('credentials/'+doc.id).get();
    if(credSnap.exists){
      const cred = credSnap.data();
      const hash = await hashPassword(password, cred.salt || '');
      if(hash === cred.passwordHash){
        valid = true;
      } else {
        const legacyHash = await legacyHashPassword(password, cred.salt || '');
        if(legacyHash === cred.passwordHash){
          valid = true;
          // ترقية تلقائية للتشفير الأقوى أول ما الحساب القديم يسجل دخول بنجاح
          const upgraded = await hashPassword(password, cred.salt || '');
          await dbDoc('credentials/'+doc.id).set({ salt: cred.salt||'', passwordHash: upgraded }).catch(()=>{});
        }
      }
    } else if(u.password && u.password === password){
      const salt = randomSalt();
      const passwordHash = await hashPassword(password, salt);
      await dbDoc('credentials/'+doc.id).set({ salt, passwordHash });
      await dbDoc('users/'+doc.id).update({ password: null }).catch(()=>{});
      valid = true;
    }
    if(!valid){ state.loginError = 'بيانات الدخول غير صحيحة'; return; }
    state.loginError = '';
    state.currentUser = { id:doc.id, username:u.username, name:u.name||u.username, role:u.role||'staff' };
    // توكن جلسة عشوائي بيتغيّر مع كل تسجيل دخول، بدل الاعتماد على اسم المستخدم لوحده
    // (اللي كان ممكن حد يحطه يدويًا في localStorage ويدخل بحساب مش بتاعه من غير باسورد)
    const sessionToken = randomSalt();
    await dbDoc('users/'+doc.id).update({ sessionToken }).catch(()=>{});
    localStorage.setItem(LS_KEY, JSON.stringify({ username: u.username, token: sessionToken }));
    state.view='shift';
    subscribeUsersIfAdmin();
    if(u.mustChangePassword){
      askInput('لازم تغيّر كلمة المرور الافتراضية الأول', [
        {key:'newpass', label:'كلمة مرور جديدة', type:'password', value:''},
      ], 'force-change-password', {id:doc.id});
    }
  }catch(e){
    console.error(e);
    state.loginError = 'تعذر تسجيل الدخول، حاول مرة أخرى';
  } finally {
    setBusy(false);
    render();
  }
}
function doLogout(){
  if(usersSub){ try{ usersSub(); }catch(e){} usersSub = null; }
  state.users = [];
  state.currentUser = null; localStorage.removeItem(LS_KEY); render();
}

function buildBreakdownFor(shiftId){
  const sessionsInShift = state.sessions.filter(s => s.shiftId === shiftId && s.status === 'closed');
  const devMap = {};
  sessionsInShift.forEach(s=>{
    const discount = Number(s.discount)||0;
    if(s.billingType === 'time'){
      const key = (s.stationCategory||'device') + '__' + sessionKind(s) + '__' + (s.mode||'solo');
      if(!devMap[key]) devMap[key] = { key, category:s.stationCategory||'device', kind:sessionKind(s), modeLabel: MODE_LABEL[s.mode]||s.mode, count:0, revenue:0 };
      devMap[key].count++;
      devMap[key].revenue += Math.max(0, (Number(s.timeCost)||0) - discount); // الصافي بعد الخصم
    } else {
      let lastKey = null;
      getSegments(s).forEach(seg=>{
        if(!seg.endTime) return;
        const key = (s.stationCategory||'device') + '__' + (seg.kind||'?') + '__' + (seg.mode||'solo');
        if(!devMap[key]) devMap[key] = { key, category:s.stationCategory||'device', kind:seg.kind, modeLabel: MODE_LABEL[seg.mode]||seg.mode, count:0, revenue:0 };
        devMap[key].count++;
        devMap[key].revenue += Number(seg.cost)||0;
        lastKey = key;
      });
      if(lastKey && discount > 0) devMap[lastKey].revenue = Math.max(0, devMap[lastKey].revenue - discount); // الخصم على آخر نمط
    }
  });
  const deviceBreakdown = Object.values(devMap).sort((a,b)=> a.category.localeCompare(b.category) || String(a.kind).localeCompare(String(b.kind)) || a.modeLabel.localeCompare(b.modeLabel));

  const drinkMap = {};
  state.drinks.forEach(d => { drinkMap[d.id] = { drinkId:d.id, name:d.name, price:d.price, qty:0, revenue:0 }; });
  sessionsInShift.forEach(s=>{
    (s.drinks||[]).forEach(l=>{
      if(!drinkMap[l.drinkId]) drinkMap[l.drinkId] = { drinkId:l.drinkId, name:l.name, price:l.price, qty:0, revenue:0 };
      drinkMap[l.drinkId].qty += l.qty;
      drinkMap[l.drinkId].revenue += l.qty*l.price;
    });
  });
  const directSales = state.drinkSales.filter(x => x.shiftId === shiftId);
  directSales.forEach(sale=>{
    if(!drinkMap[sale.drinkId]) drinkMap[sale.drinkId] = { drinkId:sale.drinkId, name:sale.drinkName, price:sale.price, qty:0, revenue:0 };
    drinkMap[sale.drinkId].qty += sale.qty;
    drinkMap[sale.drinkId].revenue += sale.qty*sale.price;
  });
  const drinkBreakdown = Object.values(drinkMap);

  const expenseBreakdown = state.expenses.filter(e => e.shiftId === shiftId)
    .map(e => ({ category:e.categoryName, amount:e.amount, note:e.note, time:e.time }));
  const deviceRevenue = deviceBreakdown.reduce((a,x)=>a+x.revenue,0);
  const drinksRevenue = drinkBreakdown.reduce((a,x)=>a+x.revenue,0);
  const expensesTotal = expenseBreakdown.reduce((a,x)=>a+Number(x.amount||0),0);
  const netTotal = deviceRevenue + drinksRevenue - expensesTotal;
  return { deviceBreakdown, drinkBreakdown, expenseBreakdown, deviceRevenue, drinksRevenue, expensesTotal, netTotal };
}
async function endShift(){
  const shift = openShift(); if(!shift) return;
  const running = state.devices.filter(d => d.status==='active')
    .filter(d=>{ const s = state.sessions.find(x=>x.id===d.sessionId); return s && s.shiftId===shift.id; });
  if(running.length){ showNotice('أنهِ كل الجلسات الشغالة أولاً: ' + running.map(d=>d.name).join('، ')); return; }
  try{
    setBusy(true);
    const b = buildBreakdownFor(shift.id);
    const endTime = nowIso();
    await dbDoc('shifts/'+shift.id).update({ status:'closed', endTime, ...b });
    await dbDoc('meta/shift').set({ activeShiftId:null });
    state.reportShift = { ...shift, endTime, status:'closed', ...b };
  }catch(e){ console.error(e); showNotice('تعذر إنهاء الشفت'); }
  finally{ setBusy(false); render(); }
}

/* ---------- Session actions ---------- */
async function startSession(deviceId, customerId, kind, mode, billingType, prepaidAmount){
  const device = state.devices.find(d => d.id === deviceId);
  if(!device || device.status === 'active') return;
  if(!openShift()){ showNotice('افتح الشفت أولاً من صفحة "الشفت"'); return; }
  const customer = customerId ? state.customers.find(c=>c.id===customerId) : null;
  const prices = resolvePrices(customer, device, kind, mode);
  const isTime = billingType === 'time';
  const amount = isTime ? Number(prepaidAmount)||0 : 0;
  if(isTime && amount > 0 && prices.q > 0 && amount < prices.q){
    showNotice('المبلغ أقل من سعر الربع ساعة (' + money(prices.q) + ' ج.م) — اختر مبلغًا أكبر'); return;
  }
  const plannedMinutes = (isTime && amount > 0) ? minutesForAmount(prices, amount) : null;
  const startTime = nowIso();

  setBusy(true);
  try{
    const deviceRef = dbDoc('devices/'+deviceId);
    const newSessionRef = dbCol('sessions').doc();
    const shiftId = openShift().id;
    await runTx(async tx=>{
      const dSnap = await tx.get(deviceRef);
      if(!dSnap.exists) throw new Error('الجهاز غير موجود');
      const d = dSnap.data();
      if(d.status === 'active') throw new Error('الجهاز محجوز من موظف آخر');
      tx.set(newSessionRef, {
        deviceId, deviceName: device.name, stationCategory: device.category || 'device',
        deviceKind: kind, deviceType: kind, mode: mode || 'solo',
        customerId: customer ? customer.id : null, customerName: customer ? customer.name : 'زائر بدون حساب',
        rate: prices.hr, prices, startTime, endTime:null, status:'active',
        billingType: isTime ? 'time' : 'open', prepaidAmount: amount, plannedMinutes,
        segments: [{ kind, mode: mode||'solo', rate: prices.hr, prices, startTime, endTime:null, minutes:null, cost:null }],
        drinks:[], timeCost: isTime ? amount : 0, drinksCost:0, discount:0, total: isTime ? amount : 0,
        shiftId,
      });
      tx.update(deviceRef, { status:'active', sessionId: newSessionRef.id });
    });
    state.openDeviceId = deviceId;
    state.startKind='PS5'; state.startMode='solo'; state.startBillingType='open'; state.startPrepaidAmount=0; state.startCustomerId='';
    state.drinkPickerQty = {}; state.closeDiscount = 0;
  }catch(e){ console.error(e); showNotice(e.message || 'تعذر بدء الجلسة'); }
  finally{ setBusy(false); scheduleRender(); }
}

async function switchSessionRate(sessionId, newKind, newMode){
  const session = state.sessions.find(s=>s.id===sessionId); if(!session) return;
  if(sessionKind(session) === newKind && session.mode === newMode){
    state.switchPickerOpen = false; scheduleRender(); return;
  }
  const device = state.devices.find(d=>d.id===session.deviceId);
  const customer = session.customerId ? state.customers.find(c=>c.id===session.customerId) : null;
  const newPrices = resolvePrices(customer, device, newKind, newMode);
  const now = nowIso();
  const segments = getSegments(session).map(s=>({...s}));
  const last = segments[segments.length-1];
  if(!last.endTime){
    const segMins = minutesBetween(last.startTime, now);
    last.endTime = now; last.minutes = segMins;
    last.cost = roundMoney(last.rate*segMins/60);
  }
  segments.push({ kind:newKind, mode:newMode, rate:newPrices.hr, prices:newPrices, startTime:now, endTime:null, minutes:null, cost:null });

  let newPlannedMinutes = session.plannedMinutes;
  if(session.billingType === 'time' && Number(session.prepaidAmount) > 0){
    let consumed = 0;
    for(const seg of segments.slice(0,-1)){
      const segMins = Number(seg.minutes) || 0;
      const segPrices = seg.prices || { q:0, h:0, hr: seg.rate||0 };
      consumed += amountForMinutes(segPrices, segMins);
    }
    const remaining = Math.max(0, Number(session.prepaidAmount) - consumed);
    const totalElapsed = minutesBetween(session.startTime, now);
    newPlannedMinutes = Math.round(totalElapsed + minutesForAmount(newPrices, remaining));
  }

  const drinksCost = (session.drinks||[]).reduce((a,x)=>a+x.qty*x.price,0);
  const timeCost = computeSessionTimeCost({ ...session, segments, plannedMinutes: newPlannedMinutes }, nowIso());
  setBusy(true);
  try{
    await dbDoc('sessions/'+sessionId).update({
      segments, deviceKind:newKind, deviceType:newKind, mode:newMode,
      rate: newPrices.hr, prices: newPrices, plannedMinutes: newPlannedMinutes,
      timeCost, total: timeCost + drinksCost,
    });
    state.switchPickerOpen = false;
  }catch(e){ console.error(e); showNotice('تعذر تغيير النمط'); }
  finally{ setBusy(false); scheduleRender(); }
}
function activeSessionFor(deviceId){
  const device = state.devices.find(d => d.id === deviceId);
  if(!device || !device.sessionId) return null;
  return state.sessions.find(s => s.id === device.sessionId) || null;
}

async function addDrinkToSession(sessionId, drinkId, qty){
  qty = Math.max(1, Number(qty)||1);
  const drink = state.drinks.find(d => d.id === drinkId);
  if(!drink) return;
  setBusy(true);
  try{
    const sessionRef = dbDoc('sessions/'+sessionId);
    const drinkRef = dbDoc('drinks/'+drinkId);
    await runTx(async tx=>{
      const [sSnap, dSnap] = [await tx.get(sessionRef), await tx.get(drinkRef)];
      if(!sSnap.exists) throw new Error('الجلسة غير موجودة');
      if(!dSnap.exists) throw new Error('المشروب غير موجود');
      const s = sSnap.data();
      const d = dSnap.data();
      const stock = Number(d.stock)||0;
      if(stock < qty) throw new Error('الكمية المتاحة بالمخزون غير كافية');
      const drinksList = Array.isArray(s.drinks) ? [...s.drinks] : [];
      const existing = drinksList.find(x => x.drinkId === drinkId);
      if(existing) existing.qty += qty;
      else drinksList.push({ drinkId, name:d.name, price:d.price, qty });
      const drinksCost = drinksList.reduce((a,x)=>a+x.qty*x.price,0);
      const timeCost = computeSessionTimeCost({ ...s, drinks: drinksList }, nowIso());
      tx.update(drinkRef, { stock: stock - qty });
      tx.update(sessionRef, { drinks:drinksList, drinksCost, timeCost, total:drinksCost+timeCost });
    });
    state.drinkPickerOpen = false;
  }catch(e){ console.error(e); showNotice(e.message || 'تعذر إضافة المشروب'); }
  finally{ setBusy(false); scheduleRender(); }
}
async function removeDrinkLine(sessionId, drinkId){
  setBusy(true);
  try{
    const sessionRef = dbDoc('sessions/'+sessionId);
    await runTx(async tx=>{
      const sSnap = await tx.get(sessionRef);
      if(!sSnap.exists) throw new Error('الجلسة غير موجودة');
      const s = sSnap.data();
      const line = (s.drinks||[]).find(x => x.drinkId === drinkId);
      if(!line) return;
      const drinkRef = dbDoc('drinks/'+drinkId);
      const dSnap = await tx.get(drinkRef);
      const curStock = dSnap.exists ? (Number(dSnap.data().stock)||0) : 0;
      if(dSnap.exists) tx.update(drinkRef, { stock: curStock + line.qty });
      const drinksList = (s.drinks||[]).filter(x => x.drinkId !== drinkId);
      const drinksCost = drinksList.reduce((a,x)=>a+x.qty*x.price,0);
      const timeCost = computeSessionTimeCost({ ...s, drinks: drinksList }, nowIso());
      tx.update(sessionRef, { drinks:drinksList, drinksCost, timeCost, total:drinksCost+timeCost });
    });
  }catch(e){ console.error(e); showNotice('تعذر حذف المشروب'); }
  finally{ setBusy(false); scheduleRender(); }
}
async function closeSession(sessionId, deviceId){
  const session = state.sessions.find(s => s.id === sessionId); if(!session) return;
  setBusy(true);
  try{
    const endTime = nowIso();
    const segments = getSegments(session).map(s=>({...s}));
    const last = segments[segments.length-1];
    if(!last.endTime){
      const segMins = minutesBetween(last.startTime, endTime);
      last.endTime = endTime; last.minutes = segMins;
      last.cost = roundMoney(last.rate*segMins/60);
    }
    const timeCost = computeSessionTimeCost(session, endTime);
    const drinksCost = (session.drinks||[]).reduce((a,x)=>a+x.qty*x.price,0);
    // خصم يدوي — الأدمن فقط
    const discount = isAdmin() ? Math.min(Math.max(0, Number(state.closeDiscount)||0), timeCost + drinksCost) : 0;
    const total = Math.max(0, timeCost + drinksCost - discount);
    const prepaid = session.billingType==='time' ? Number(session.prepaidAmount)||0 : 0;
    const dueAfterPrepaid = Math.max(0, total - prepaid);

    const sessionRef = dbDoc('sessions/'+sessionId);
    const deviceRef = dbDoc('devices/'+deviceId);
    const customerRef = session.customerId ? dbDoc('customers/'+session.customerId) : null;

    let balanceUsed = 0, cashDue = dueAfterPrepaid, balanceAfter = null;
    await runTx(async tx=>{
      if(customerRef){
        const cSnap = await tx.get(customerRef);
        const bal = cSnap.exists ? (Number(cSnap.data().balance)||0) : 0;
        if(bal >= dueAfterPrepaid){ balanceUsed = dueAfterPrepaid; cashDue = 0; balanceAfter = bal - dueAfterPrepaid; }
        else { balanceUsed = bal; cashDue = dueAfterPrepaid - bal; balanceAfter = 0; }
        tx.update(customerRef, { balance: balanceAfter });
      }
      tx.update(sessionRef, { status:'closed', endTime, segments, timeCost, drinksCost, discount, total, balanceUsed, cashDue, balanceAfter });
      tx.update(deviceRef, { status:'idle', sessionId:null });
    });

    state.openDeviceId = null;
    state.closeDiscount = 0;
    state.receiptSession = { ...session, endTime, segments, timeCost, drinksCost, discount, total, balanceUsed, cashDue, balanceAfter, status:'closed' };
  }catch(e){ console.error(e); showNotice('تعذر إنهاء الجلسة'); }
  finally{ setBusy(false); scheduleRender(); }
}
/* إلغاء الجلسة: الأدمن فقط — الموظف لا يستطيع إطلاقًا */
function cancelSession(sessionId, deviceId){
  if(!isAdmin()){ showNotice('غير مسموح — إلغاء الجلسات للمدير فقط'); return; }
  askConfirm('إلغاء هذه الجلسة؟ سيتم إرجاع المشروبات للمخزون.', 'cancel-session', {sessionId, deviceId});
}
async function doCancelSession(sessionId, deviceId){
  const session = state.sessions.find(s => s.id === sessionId);
  const sessionRef = dbDoc('sessions/'+sessionId);
  const deviceRef = dbDoc('devices/'+deviceId);
  await runTx(async tx=>{
    if(session){
      for(const line of (session.drinks||[])){
        const dRef = dbDoc('drinks/'+line.drinkId);
        const dSnap = await tx.get(dRef);
        if(dSnap.exists){
          tx.update(dRef, { stock: (Number(dSnap.data().stock)||0) + line.qty });
        }
      }

async function sellDrink(drinkId, qty){
  qty = Math.max(1, Number(qty)||1);
  const drink = state.drinks.find(d => d.id === drinkId);
  if(!drink) return;
  const shift = openShift();
  const u = currentUser();
  setBusy(true);
  try{
    const drinkRef = dbDoc('drinks/'+drinkId);
    const saleRef = dbCol('drinkSales').doc();
    const sale = {
      drinkId, drinkName: drink.name, price: Number(drink.price)||0,
      qty, total: qty * (Number(drink.price)||0),
      time: nowIso(),
      soldBy: u ? u.username : 'unknown',
      soldByName: u ? (u.name||u.username) : 'غير معروف',
      shiftId: shift ? shift.id : null,
    };
    await runTx(async tx=>{
      const dSnap = await tx.get(drinkRef);
      if(!dSnap.exists) throw new Error('المشروب غير موجود');
      const stock = Number(dSnap.data().stock)||0;
      if(stock < qty) throw new Error('الكمية المتاحة بالمخزون غير كافية');
      tx.update(drinkRef, { stock: stock - qty });
      tx.set(saleRef, sale);
    });
    state.sellModal = null;
    state.sellQty = 1;
    state.saleReceipt = { id: saleRef.id, ...sale };
  }catch(e){ console.error(e); showNotice(e.message || 'تعذر إتمام البيع'); }
  finally{ setBusy(false); scheduleRender(); }
}

async function updateStationPrice(id, kind, mode, field, value){
  const device = state.devices.find(d=>d.id===id); if(!device) return;
  const prices = JSON.parse(JSON.stringify(device.prices || {}));
  KINDS.forEach(k=>{
    prices[k] = prices[k] || {};
    MODES.forEach(m=>{
      const existing = prices[k][m] || {};
      const base = getPrices(device, k, m);
      prices[k][m] = { q: existing.q ?? base.q, h: existing.h ?? base.h, hr: existing.hr ?? base.hr };
    });
  });
  prices[kind][mode][field] = Math.max(0,Number(value)||0);
  try{ await dbDoc('devices/'+id).update({ prices }); }
  catch(e){ console.error(e); showNotice('تعذر تحديث السعر'); }
}
function deleteStation(id){
  const d = state.devices.find(x=>x.id===id);
  if(d && d.status === 'active'){ showNotice('لا يمكن الحذف أثناء وجود جلسة نشطة عليه'); return; }
  askConfirm('تأكيد الحذف؟', 'delete-station', {id});
}
function extractNum(name){
  const m = /(\d+)/.exec(name||'');
  return m ? parseInt(m[1],10) : Number.POSITIVE_INFINITY;
}
async function adjustStationCount(category, delta){
  const items = state.devices.filter(d => (d.category||'device') === category);
  const singular = category==='room' ? 'روم' : 'جهاز';
  if(delta > 0){
    const used = new Set(items.map(d=>extractNum(d.name)).filter(n=>Number.isFinite(n)));
    let n = 1; while(used.has(n)) n++;
    await addStation(category, `${singular} ${n}`);
  } else if(delta < 0){
    if(!items.length) return;
    const idle = items.filter(d => d.status !== 'active');
    if(!idle.length){ showNotice('لا يمكن إنقاص العدد — كل الأجهزة مشغولة حاليًا، أنهِ الجلسات أولاً'); return; }
    const sorted = [...idle].sort((a,b)=> (extractNum(b.name)||0) - (extractNum(a.name)||0));
    const target = sorted[0];
    askConfirm('سيتم حذف "'+target.name+'" — تأكيد؟', 'remove-station', {id: target.id});
  }
}

  if(!u) return;
  if(u.username === 'admin' || u.protected){ showNotice('لا يمكن حذف حساب المدير الرئيسي'); return; }
  if(state.currentUser && u.username === state.currentUser.username){ showNotice('لا يمكنك حذف حسابك الحالي'); return; }
  if(u.role === 'admin'){
    const otherAdmins = state.users.filter(x=>x.role==='admin' && x.username!=='admin' && !x.protected && x.id!==id);
    if(!otherAdmins.length){ showNotice('لا يمكن حذف آخر مدير في النظام'); return; }

/* تعديل حساب موظف (يوزر/باسورد/اسم/صلاحية) — الأدمن، والتعديل بيتطبق على كل الفروع */
function openStaffEdit(id){ state.staffEditId = id; render(); }
function closeStaffEdit(){ state.staffEditId = null; render(); }
async function saveStaffEdit(){
  const id = state.staffEditId; if(!id) return;
  const isSelf = state.currentUser && id === state.currentUser.id;
  const adminEditing = isAdmin();
  const u = state.users.find(x=>x.id===id) || (isSelf ? state.currentUser : null);
  if(!u){ closeStaffEdit(); return; }
  const oldUsername = u.username;
  const username = adminEditing ? (val('se-username').trim() || oldUsername) : oldUsername;
  const name = adminEditing ? (val('se-name').trim() || u.name || username) : (u.name || username);
  const role = adminEditing ? (val('se-role') === 'admin' ? 'admin' : 'staff') : (u.role || 'staff');
  const password = val('se-password').trim();
  if(!username){ showNotice('اسم المستخدم مطلوب'); return; }
  if(adminEditing && username !== oldUsername){
    const dup = state.users.find(x=>x.username===username && x.id!==id);
    if(dup){ showNotice('اسم المستخدم مستخدم بالفعل'); return; }
  }
  if(u.username === 'admin' && role !== 'admin'){ showNotice('لا يمكن إنزال صلاحية المدير الرئيسي'); return; }
  setBusy(true);
  try{
    await dbDoc('users/'+id).update({ username, name, role });
    if(password){
      const salt = randomSalt();
      const passwordHash = await hashPassword(password, salt);
      await dbDoc('credentials/'+id).set({ salt, passwordHash });
    }
    // حساب الأدمن الرئيسي (admin) حساب عام: تعديله بيتطبق على كل الفروع —
    // أما حسابات الموظفين فخاصة بكل فرع ومش بتتنشر على باقي الفروع
    const isMainAdmin = (oldUsername === 'admin') || !!u.protected;
    if(isMainAdmin){
      for(const b of state.branches){
        if(b.id === state.shopId) continue;
        try{
          const snap = await db.collection('shops/'+b.id+'/users').where('username','==',oldUsername).limit(5).get();
          for(const d of snap.docs){
            await db.collection('shops/'+b.id+'/users').doc(d.id).update({ username, name, role });
            if(password){
              const salt2 = randomSalt();
              const hash2 = await hashPassword(password, salt2);
              await db.doc('shops/'+b.id+'/credentials/'+d.id).set({ salt: salt2, passwordHash: hash2 });
            }
          }
        }catch(e){ console.error('branch propagate failed', b.id, e); }
      }
    }
    if(isSelf && state.currentUser){
      state.currentUser.username = username;
      state.currentUser.name = name;
      state.currentUser.role = role;
      const raw = localStorage.getItem(LS_KEY);
      let saved; try{ saved = JSON.parse(raw); }catch(e){ saved = null; }
      if(saved) localStorage.setItem(LS_KEY, JSON.stringify({ username, token: saved.token }));
    }
    state.staffEditId = null;
    showNotice((isMainAdmin ? 'تم حفظ التعديلات على جميع الفروع' : 'تم حفظ التعديلات على هذا الفرع') + (password ? ' (شملت كلمة المرور)' : ''));
  }catch(e){ console.error(e); showNotice('تعذر الحفظ'); }
  finally{ setBusy(false); scheduleRender(); }
}

/* ---------- Render ---------- */
function scheduleRender(){
  if(renderQueued) return;
  renderQueued = true;
  queueMicrotask(()=>{ renderQueued = false; render(); });
}
function render(){
  if(rendering) return;
  rendering = true;
  const app = document.getElementById('app');
  const active = document.activeElement;
  const focusId = active && active.id ? active.id : null;
  const focusVal = active && ('value' in active) ? active.value : null;
  const selStart = active && ('selectionStart' in active) ? active.selectionStart : null;
  const selEnd = active && ('selectionEnd' in active) ? active.selectionEnd : null;

  if(bootError){ app.innerHTML = renderBootError(); rendering = false; return; }
  let html, attach;
  if(!state.shopId){ html = renderBranchSelector(); attach = attachBranchSelectorEvents; }
  else if(!currentUser()){ html = renderLogin(); attach = attachLoginEvents; }
  else { html = renderShell(); attach = attachShellEvents; }
  app.innerHTML = html + renderGlobalOverlays() + renderBusyOverlay();
  try{ attach(); }catch(e){ console.error('attach error', e); }
  attachGlobalOverlayEvents();

  if(focusId){
    const el = document.getElementById(focusId);
    if(el){
      if(focusVal !== null && 'value' in el && el.value !== focusVal) el.value = focusVal;
      try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
      if(selStart != null && typeof el.setSelectionRange === 'function'){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
  rendering = false;
}

function attachSettingsEvents(){
  document.getElementById('save-appname-btn')?.addEventListener('click', ()=>{
    const v = document.getElementById('app-name-input').value.trim();
    state.branding.appName = v || null;
    saveBrandingField('appName', v || null);
    document.title = brandName();
    render();
  });
  document.getElementById('logo-upload-input')?.addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ev => { img.onload = ()=>{
      // نصغّر الصورة قبل الحفظ عشان الملف يفضل خفيف
      const maxSide = 240;
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/png', 0.85);
      state.branding.logoDataUrl = dataUrl;
      saveBrandingField('logoDataUrl', dataUrl);
      render();
    }; img.src = ev.target.result; };
    reader.readAsDataURL(file);
  });
  document.getElementById('add-branch-btn')?.addEventListener('click', ()=>{
    askInput('فرع جديد', [{key:'name', label:'اسم الفرع', type:'text', value:''}], 'add-branch', {});
  });
  document.querySelectorAll('[data-save-branch]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-save-branch');
      const v = document.getElementById('branch-name-'+id).value;
      renameBranch(id, v);
    });
  });
  document.querySelectorAll('[data-del-station-branch]').forEach(el=>{
    el.addEventListener('click', ()=> deleteBranch(el.getAttribute('data-del-station-branch')));
  });
  document.querySelectorAll('[data-pick-theme]').forEach(el=>{
    el.addEventListener('click', ()=>{ applyTheme(el.getAttribute('data-pick-theme')); render(); });
  });
  document.querySelectorAll('[data-set-lang]').forEach(el=>{
    el.addEventListener('click', ()=> setLang(el.getAttribute('data-set-lang')));
  });
}

function sessionTimerDisplay(session, mins){
  const planned = Number(session.plannedMinutes)||0;
  if(session.billingType === 'time' && planned>0){
    const remaining = planned - mins;
    return remaining >= 0 ? fmtDuration(remaining) : ('+'+fmtDuration(mins-planned));
  }
  return fmtDuration(mins);
}
function pricesSummary(device, kind, mode){
  const p = getPrices(device, kind, mode);
  return `${money(p.q)}/${money(p.h)}/${money(p.hr)}`;
}

function exportHistoryCsv(){
  const from = state.historyFrom, to = state.historyTo;
  if(state.historyTab === 'shifts'){
    const rows = state.shifts
      .filter(s=>s.status==='closed' && inDateRange(s.startTime, from, to))
      .sort((a,b)=> new Date(b.startTime)-new Date(a.startTime))
      .map(s=>[s.openedByName||'', fmtDateTime(s.startTime), fmtDateTime(s.endTime), s.deviceRevenue||0, s.drinksRevenue||0, s.expensesTotal||0, s.netTotal||0]);
    exportCsv('shifts.csv', ['فتحه','البداية','الإغلاق','إيراد الأجهزة','إيراد المشروبات','المصروفات','الصافي'], rows);
  } else if(state.historyTab === 'sessions'){
    const rows = state.sessions
      .filter(s => s.status==='closed' && inDateRange(s.startTime, from, to))
      .sort((a,b)=> new Date(b.startTime)-new Date(a.startTime))
      .map(s=>[s.deviceName||'', sessionKind(s), MODE_LABEL[s.mode]||s.mode||'', s.customerName||'زائر',
        Math.round(minutesBetween(s.startTime, s.endTime)), fmtDateTime(s.endTime),
        s.timeCost||0, s.drinksCost||0, s.discount||0, s.total||0]);
    exportCsv('sessions.csv', ['الجهاز','النوع','النمط','العميل','المدة بالدقائق','الإغلاق','الوقت','المشروبات','الخصم','الإجمالي'], rows);
  } else {
    const rows = state.drinkSales
      .filter(s => inDateRange(s.time, from, to))
      .sort((a,b)=> new Date(b.time)-new Date(a.time))
      .map(s=>[s.drinkName||'', s.qty, s.price, s.total, s.soldByName||'', fmtDateTime(s.time)]);
    exportCsv('sales.csv', ['الصنف','الكمية','السعر','الإجمالي','الموظف','الوقت'], rows);
  }
}

/* ---------- Modals ---------- */
function renderModals(){
  let html = '';
  if(state.openDeviceId){
    const device = state.devices.find(d => d.id === state.openDeviceId);
    if(device) html += device.status === 'idle' ? renderStartModal(device) : renderSessionModal(device);
  }
  if(state.expenseModalOpen) html += renderExpenseModal();
  if(state.receiptSession) html += renderReceiptModal(state.receiptSession);
  if(state.reportShift) html += renderShiftReportModal(state.reportShift);
  if(state.sellModal) html += renderSellModal();
  if(state.saleReceipt) html += renderSaleReceiptModal(state.saleReceipt);
  if(state.staffEditId) html += renderStaffEditModal();
  return html;
}
function renderStartModal(device){

  const billing = state.startBillingType || 'open';

  const prices = resolvePrices(selectedCustomer, device, kind, mode);

  const plannedMins = (billing==='time' && amount>0) ? minutesForAmount(prices, amount) : 0;

      ${MODES.map(m=>{
        const p = resolvePrices(selectedCustomer, device, kind, m);
        return `<div class="mode-chip ${mode===m?'sel':''}" data-pick-mode="${m}">
          <span class="lbl">${MODE_LABEL[m]}</span>
          <span class="pr num">${money(p.q)}/${money(p.h)}/${money(p.hr)}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="field"><label>نوع الجلسة</label></div>
    <div class="mode-choice" style="grid-template-columns:repeat(2,1fr)">
      <div class="mode-chip ${billing==='time'?'sel':''}" data-pick-billing="time"><span class="lbl">تايم ⏱️</span><span class="pr">عد تنازلي</span></div>
      <div class="mode-chip ${billing==='open'?'sel':''}" data-pick-billing="open"><span class="lbl">أوبن ▶️</span><span class="pr">عد تصاعدي</span></div>
    </div>
    ${billing==='time' ? `
      <div class="field"><label>المبلغ (أقل من ${money(prices.q)} ج.م غير مقبول)</label></div>
      <div class="mode-choice" style="grid-template-columns:repeat(5,1fr);gap:6px">
        ${amountChips.map(a=>`<div class="mode-chip ${amount===a?'sel':''}" data-pick-amount="${a}" style="padding:9px 4px"><span class="lbl num">${a}</span></div>`).join('')}

      <div class="kv-row" style="border:none"><span class="k">المدة المقابلة</span><span class="v num">${amount>0?(plannedMins>0?fmtDuration(plannedMins):'أقل من الربع — غير مقبول'):'اختر مبلغًا'}</span></div>
    ` : ''}
    <div class="field"><label>العميل (اختياري)</label>
      <select id="start-customer"><option value="" ${!state.startCustomerId?'selected':''}>زائر بدون حساب</option>${opts}</select>
    </div>
    <button class="btn btn-primary" id="confirm-start-btn" style="width:100%" ${billing==='time' && (amount<=0 || plannedMins<=0) ? 'disabled':''}>بدء الجلسة الآن</button>
  </div></div>`;
}
function renderSessionModal(device){
  const session = activeSessionFor(device.id);
  if(!session) return `<div class="modal-scrim" data-close-modal="1"><div class="modal"><div class="empty-state">تعذر تحميل بيانات الجلسة</div></div></div>`;
  const isTime = session.billingType === 'time';
  const mins = minutesBetween(session.startTime, nowIso());
  const segs = getSegments(session);
  const curSeg = segs[segs.length-1];
  const timeCost = computeSessionTimeCost(session, nowIso());
  const drinksCost = (session.drinks||[]).reduce((a,x)=>a+x.qty*x.price,0);
  const discount = isAdmin() ? Math.min(Math.max(0, Number(state.closeDiscount)||0), timeCost + drinksCost) : 0;
  const total = Math.max(0, timeCost + drinksCost - discount);
  const prepaidNow = isTime ? (Number(session.prepaidAmount)||0) : 0;
  const dueAfterPrepaid = Math.max(0, total - prepaidNow);
  const customer = session.customerId ? state.customers.find(c=>c.id===session.customerId) : null;
  const balanceNow = customer ? (Number(customer.balance)||0) : 0;
  const projectedBalance = Math.max(0, balanceNow - dueAfterPrepaid);
  const drinkLines = (session.drinks||[]).map(l => `
    <div class="drink-line"><span>${esc(l.name)} × ${l.qty}</span>
      <span style="display:flex;align-items:center;gap:8px"><b class="num">${money(l.price*l.qty)} ج.م</b>
      <button class="btn btn-ghost btn-sm" data-remove-drinkline="${l.drinkId}" data-session="${session.id}" style="padding:3px 8px">✕</button></span>
    </div>`).join('');
  const pastSegRows = segs.slice(0,-1).map(s=>`
    <div class="kv-row"><span class="k">${esc(s.kind)} · ${esc(MODE_LABEL[s.mode]||s.mode)} (${s.minutes!=null?fmtDuration(s.minutes):''})</span>
    <span class="v">${money(s.cost)} ج.م</span></div>`).join('');
  return `<div class="modal-scrim" data-close-modal="1"><div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <h3 class="modal-title">${esc(device.name)}<small>${esc(sessionKind(session))} · ${esc(MODE_LABEL[session.mode]||'')} · ${isTime?'تايم':'أوبن'} · ${esc(session.customerName)}</small></h3>
      <button class="modal-close" data-close-modal="1">✕</button>
    </div>
    <div class="kv-row"><span class="k">وقت البدء</span><span class="v">${fmtDateTime(session.startTime)}</span></div>
    <div class="kv-row"><span class="k">${isTime?'الوقت المتبقي':'المدة الآن'}</span>
      <span class="v num" id="modal-timer" data-start="${session.startTime}" data-billing="${session.billingType||'open'}" data-planned="${session.plannedMinutes||0}">${sessionTimerDisplay(session, mins)}</span></div>
    ${isTime ? `<div class="kv-row"><span class="k">المبلغ المدفوع مقدمًا</span><span class="v">${money(session.prepaidAmount||0)} ج.م</span></div>` : ''}
    <div class="kv-row"><span class="k">سعر الساعة الحالي</span><span class="v">${money(curSeg.rate)} ج.م/س</span></div>
    ${pastSegRows ? `<div class="section-head" style="margin:14px 0 4px"><h3>فترات سابقة</h3></div>${pastSegRows}` : ''}
    ${customer ? `<div class="kv-row"><span class="k">رصيد ${esc(customer.name)} الآن</span><span class="v num">${money(balanceNow)} ج.م</span></div>
      <div class="kv-row"><span class="k">الرصيد بعد الخصم (تقديري)</span><span class="v num">${money(projectedBalance)} ج.م</span></div>` : ''}
    <div class="section-head" style="margin:16px 0 6px"><h3>النمط الحالي</h3>
      <button class="btn btn-ghost btn-sm" id="open-switch-picker">تغيير النمط</button></div>
    ${state.switchPickerOpen ? renderSwitchPicker(device, session) : ''}
    <div class="section-head" style="margin:16px 0 6px"><h3>المشروبات</h3>
      <button class="btn btn-gold btn-sm" id="open-drink-picker">+ إضافة مشروب</button></div>
    ${drinkLines || `<div class="empty-state" style="padding:14px">لا توجد مشروبات مضافة</div>`}
    ${isAdmin() ? `<div class="field" style="margin-top:12px"><label>خصم قبل الإغلاق (ج.م) — المدير فقط</label>
      <input class="rate-input num" id="close-discount" type="number" min="0" style="width:120px" value="${state.closeDiscount||0}"></div>` : ''}
    <div class="total-strip"><span>الإجمالي حتى الآن</span><span class="amt num" id="modal-total">${money(total)} ج.م</span></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      ${isAdmin() ? `<button class="btn btn-danger" id="cancel-session-btn" data-session="${session.id}" data-device="${device.id}">إلغاء</button>` : ''}
      <button class="btn btn-grana" style="flex:1;min-width:150px" id="close-session-btn" data-session="${session.id}" data-device="${device.id}">إنهاء و الفاتورة</button>
    </div>
    ${state.drinkPickerOpen ? renderDrinkPicker(session.id) : ''}
  </div></div>`;
}

  const kind = state.switchKind || 'PS5';
  const mode = state.switchMode || 'solo';

  return `<div class="form-card" style="margin-bottom:14px">

    </div>
    <div class="mode-choice">
      ${MODES.map(m=>{
        const p = resolvePrices(customer, device, kind, m);

          <span class="lbl">${MODE_LABEL[m]}</span>
          <span class="pr num">${money(p.hr)} ج.م/س</span>
        </div>`;

    </div>
    <div style="display:flex;gap:10px;margin-top:10px">

function buildPrintHtml(title, innerHtml){
  return `<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${esc(title)}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Cairo',system-ui,sans-serif; padding:18px; direction:rtl; color:#111;}
    .receipt{background:#fff; padding:14px; max-width:420px; margin:0 auto;}
    .receipt-head{text-align:center;margin-bottom:14px;}
    .receipt-head svg{width:64px;height:64px;margin:0 auto 6px;display:block;}
    .receipt-head h2{margin:0;font-size:18px;}
    .receipt-head p{margin:2px 0 0;font-size:11px;color:#555;}
    hr{border:none;border-top:1px dashed #999;margin:10px 0;}
    table{width:100%;border-collapse:collapse;font-size:12px;}
    th,td{text-align:right;padding:5px 0;}
    .r-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;}
    .num{font-family:'Oswald',sans-serif;}
    @media print{body{padding:0;}}
  </style></head><body>${innerHtml}
  <script>setTimeout(function(){window.print();},400);<\/script>
  </body></html>`;
}
function openPrintWindow(title, innerHtml){
  const iframe = document.createElement('iframe');
  iframe.style.position='fixed';
  iframe.style.right='0'; iframe.style.bottom='0';
  iframe.style.width='0'; iframe.style.height='0';
  iframe.style.border='0';
  iframe.setAttribute('aria-hidden','true');
  document.body.appendChild(iframe);
  try{
    const doc = iframe.contentWindow.document;
    doc.open(); doc.write(buildPrintHtml(title, innerHtml)); doc.close();
  }catch(e){
    console.error(e);
    showNotice('تعذر فتح نافذة الطباعة');
  }
  setTimeout(()=>{ try{ iframe.remove(); }catch(e){} }, 5000);
}
