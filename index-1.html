  document.getElementById('close-session-btn')?.addEventListener('click', (e)=> closeSession(e.target.getAttribute('data-session'), e.target.getAttribute('data-device')));
  document.getElementById('cancel-session-btn')?.addEventListener('click', (e)=> cancelSession(e.target.getAttribute('data-session'), e.target.getAttribute('data-device')));

  document.getElementById('save-customer-btn')?.addEventListener('click', ()=> addCustomer(val('nc-name'), val('nc-phone'), val('nc-dob'), val('nc-balance'), val('nc-rate'), document.getElementById('nc-use-custom')?.checked));
  document.querySelectorAll('[data-rate-for]').forEach(el=> el.addEventListener('change', ()=> updateCustomerRate(el.getAttribute('data-rate-for'), el.value)));
  document.querySelectorAll('[data-rate-toggle]').forEach(el=> el.addEventListener('change', ()=> updateCustomerRateToggle(el.getAttribute('data-rate-toggle'), el.checked)));
  document.querySelectorAll('[data-balance-for]').forEach(el=> el.addEventListener('change', ()=> updateCustomerBalance(el.getAttribute('data-balance-for'), el.value)));
  document.querySelectorAll('[data-edit-customer]').forEach(el=> el.addEventListener('click', ()=> editCustomerInfo(el.getAttribute('data-edit-customer'))));
  document.querySelectorAll('[data-del-customer]').forEach(el=> el.addEventListener('click', ()=> deleteCustomer(el.getAttribute('data-del-customer'))));

  document.getElementById('save-drink-btn')?.addEventListener('click', ()=> addDrink(val('ndr-name'), val('ndr-price'), val('ndr-stock'), val('ndr-image')));
  document.querySelectorAll('[data-del-drink]').forEach(el=> el.addEventListener('click', ()=> deleteDrink(el.getAttribute('data-del-drink'))));
  document.querySelectorAll('[data-edit-drink]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const d = state.drinks.find(x=>x.id===el.getAttribute('data-edit-drink')); if(!d) return;
      askInput('تعديل ' + d.name, [
        {key:'price', label:'السعر', value:d.price, type:'number'},
        {key:'stock', label:'الكمية بالمخزون', value:d.stock, type:'number'},
      ], 'edit-drink', {id:d.id});
    });
  });

  document.getElementById('save-expcat-btn')?.addEventListener('click', ()=> addExpenseCategory(val('nexp-name')));
  document.querySelectorAll('[data-del-expcat]').forEach(el=> el.addEventListener('click', ()=> deleteExpenseCategory(el.getAttribute('data-del-expcat'))));

  document.getElementById('save-staff-btn')?.addEventListener('click', ()=> addStaff(val('ns-username'), val('ns-password'), val('ns-name'), val('ns-role')));
  document.querySelectorAll('[data-del-staff]').forEach(el=> el.addEventListener('click', ()=> deleteStaff(el.getAttribute('data-del-staff'))));
  document.querySelectorAll('[data-edit-staff]').forEach(el=> el.addEventListener('click', ()=> openStaffEdit(el.getAttribute('data-edit-staff'))));
  document.querySelectorAll('[data-close-staffedit]').forEach(el=> el.addEventListener('click', closeStaffEdit));
  document.getElementById('save-staffedit-btn')?.addEventListener('click', saveStaffEdit);

  document.querySelectorAll('[data-view-receipt]').forEach(el=> el.addEventListener('click', ()=>{
    const s = state.sessions.find(x=>x.id===el.getAttribute('data-view-receipt'));
    if(s){ state.receiptSession=s; render(); }
  }));
  document.querySelectorAll('[data-view-shift]').forEach(el=> el.addEventListener('click', ()=>{
    const s = state.shifts.find(x=>x.id===el.getAttribute('data-view-shift'));
    if(s){ state.reportShift=s; render(); }
  }));
  document.getElementById('load-older-btn')?.addEventListener('click', loadOlderSessions);
}
function val(id){ return document.getElementById(id)?.value || ''; }

function updateLiveTimers(){
  document.querySelectorAll('[id^="timer-"]').forEach(el=>{
    const deviceId = el.id.replace('timer-','');
    const session = activeSessionFor(deviceId);
    if(!session) return;
    const mins = minutesBetween(session.startTime, nowIso());
    const planned = Number(session.plannedMinutes)||0;
    const overtime = session.billingType==='time' && planned>0 && mins>planned;
    el.textContent = sessionTimerDisplay(session, mins);
    el.style.color = overtime ? 'var(--danger)' : '';
    const costEl = document.getElementById('cost-'+deviceId);
    if(costEl){
      const live = computeSessionTimeCost(session, nowIso()) + (session.drinksCost||0);
      costEl.textContent = money(live)+' ج.م';
    }
  });
  const modalTimer = document.getElementById('modal-timer');
  if(modalTimer){
    const session = state.sessions.find(s=>s.id===activeSessionFor(state.openDeviceId)?.id);
    if(session){
      const mins = minutesBetween(session.startTime, nowIso());
      const planned = Number(session.plannedMinutes)||0;
      const overtime = session.billingType==='time' && planned>0 && mins>planned;
      modalTimer.textContent = sessionTimerDisplay(session, mins);
      modalTimer.style.color = overtime ? 'var(--danger)' : '';
      const timeCost = computeSessionTimeCost(session, nowIso());
      const drinksCost = (session.drinks||[]).reduce((a,x)=>a+x.qty*x.price,0);
      const discount = isAdmin() ? Math.min(Math.max(0, Number(state.closeDiscount)||0), timeCost + drinksCost) : 0;
      const live = Math.max(0, timeCost + drinksCost - discount);
      const total = document.getElementById('modal-total'); if(total) total.textContent = money(live)+' ج.م';
    }
  }
  const shiftTimer = document.getElementById('shift-timer');
  if(shiftTimer){ shiftTimer.textContent = fmtDuration(minutesBetween(shiftTimer.getAttribute('data-start'), nowIso())); }
}
